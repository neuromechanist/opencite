[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencite"
dynamic = ["version"]
description = "Academic literature search, citation management, and PDF retrieval CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["academic", "literature", "search", "citations", "bibtex", "pdf", "pubmed", "openalex", "semantic-scholar"]
authors = [
    { name = "Seyed Yahya Shirazi", email = "shirazi@ieee.org" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "httpx>=0.27.0",
    "pyalex>=0.15",
    "markitdown>=0.1.0",
    "markit-mistral>=0.2.1",
]

[project.optional-dependencies]
convert = [
    "markitdown>=0.1.0",
    "markit-mistral>=0.2.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
opencite = "opencite.__main__:main"

[project.urls]
Repository = "https://github.com/neuromechanist/opencite"
Issues = "https://github.com/neuromechanist/opencite/issues"

[tool.hatch.version]
path = "src/opencite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opencite"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".eggs", ".git", ".venv", "build", "dist", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["opencite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit real APIs (need API keys)",
    "slow: tests that take >10 seconds",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=opencite",
    "--cov-report=term-missing",
]
